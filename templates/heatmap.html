<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clinton County — Property Tax Heat Map 2025</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;font-family:Arial,sans-serif;overflow:hidden}
#map{width:100%;height:100vh}
.panel{background:rgba(15,22,36,0.96);border:1px solid rgba(255,255,255,0.1);border-radius:10px;box-shadow:0 3px 18px rgba(0,0,0,0.5)}
#controls{position:absolute;top:10px;right:10px;z-index:1001;padding:14px 16px;width:300px}
#controls h2{font-size:12px;font-weight:700;color:#5a8abf;margin-bottom:12px;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,0.08);padding-bottom:8px}
.ctrl-section{margin-bottom:11px}
.ctrl-section label{display:block;font-size:10px;font-weight:700;color:#5a8abf;margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em}
.mode-btn{display:block;width:100%;text-align:left;padding:8px 11px;margin-bottom:4px;border:1px solid rgba(255,255,255,0.1);border-radius:6px;font-size:13px;cursor:pointer;background:rgba(255,255,255,0.04);color:#b8c8d8;transition:all .15s}
.mode-btn.active{background:#1a4a8a;color:#fff;border-color:#3a7aca;font-weight:700}
.mode-btn:hover:not(.active){background:rgba(255,255,255,0.09)}
.toggle-btn{display:inline-block;padding:5px 11px;margin:0 3px 4px 0;border:1px solid rgba(255,255,255,0.12);border-radius:4px;font-size:12px;cursor:pointer;background:rgba(255,255,255,0.04);color:#b8c8d8;transition:all .15s}
.toggle-btn.active{background:#1a4a8a;color:#fff;border-color:#3a7aca}
.toggle-btn:hover:not(.active){background:rgba(255,255,255,0.1)}
#legend{position:absolute;bottom:18px;right:10px;z-index:1001;padding:14px 16px;width:300px}
#legend h3{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#5a8abf;margin-bottom:8px}
.legend-bar{width:100%;height:13px;border-radius:3px;margin-bottom:4px}
.legend-labels{display:flex;justify-content:space-between;font-size:10px;color:#888}
.leg-item{display:flex;align-items:center;gap:5px;margin-bottom:3px}
.leg-swatch{width:11px;height:11px;border-radius:2px;flex-shrink:0;border:1px solid rgba(255,255,255,0.15);margin-top:2px}
.leg-text{font-size:12px;color:#c0d0e0;line-height:1.3}
.leg-sub{font-size:10px;color:#5a7a9a;margin-top:2px;display:block}
/* Tooltip for ⓘ */
.info-icon{display:inline-block;cursor:help;color:#5a8abf;font-size:11px;font-weight:700;margin-left:4px;position:relative}
.info-icon .tip{display:none;position:absolute;right:18px;top:-4px;width:200px;background:#0d1825;border:1px solid rgba(90,138,191,0.4);border-radius:6px;padding:8px 10px;font-size:11px;color:#c0d0e0;line-height:1.45;z-index:9999;font-weight:400;white-space:normal;box-shadow:0 4px 16px rgba(0,0,0,0.6)}
.info-icon:hover .tip{display:block}

#info-bar{position:absolute;top:10px;left:10px;z-index:1001;padding:14px 18px;width:300px}
#breakdown{position:absolute;top:50%;left:10px;transform:translateY(-50%);z-index:1001;padding:14px 16px;width:300px}
#breakdown{position:absolute;top:50%;left:10px;transform:translateY(-50%);z-index:1001;padding:14px 16px;width:300px}
#info-bar h1{font-size:16px;font-weight:700;color:#fff;margin-bottom:4px}
#info-bar p{font-size:12px;color:#6a8aaa;line-height:1.4}
.loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2000;background:rgba(15,22,36,0.97);padding:24px 36px;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,0.6);text-align:center;color:#c8d8e8;font-size:14px;border:1px solid rgba(255,255,255,0.1)}
.dot-anim::after{content:'';animation:dots 1.2s steps(4,end) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}100%{content:'...'}}
.px{font-family:Arial,sans-serif;min-width:210px;max-width:280px}
.px-title{font-weight:700;font-size:13px;margin-bottom:6px;padding-bottom:5px;border-bottom:2px solid #1a4a8a;color:#1a2535}
.px-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;margin-bottom:7px}
.px-HD{background:#dbeafe;color:#1e40af}
.px-LT{background:#f0fdf4;color:#166534}
.px-C{background:#fef3c7;color:#92400e}
.px-AG{background:#fef9c3;color:#713f12}
.px-OT{background:#f3f4f6;color:#374151}
.px-delinq{background:#fee2e2;color:#991b1b;margin-left:4px}
.px-pp{background:#ede9fe;color:#5b21b6;margin-left:4px}
.px-tbl{width:100%;border-collapse:collapse;font-size:12px}
.px-tbl td{padding:3px 4px;border-bottom:1px solid #eee;vertical-align:top}
.px-tbl td:first-child{font-weight:700;color:#555;width:46%}
.px-hi td{background:#fff7ed}
.px-hi2 td{background:#f0fdf4}
.township-label{background:transparent;border:none;box-shadow:none;color:#fff;font-size:10px;font-weight:bold;white-space:nowrap;text-shadow:0 0 4px #000,-1px -1px 0 #000,1px 1px 0 #000}
.city-label{background:transparent;border:none;box-shadow:none;color:#000000;font-size:11px;font-weight:bold;text-shadow:none;opacity:0.7}

/* ── Mobile optimization ─────────────────────────────────────────── */
@media (max-width: 768px) {
  /* Controls panel - bottom sheet, hidden by default */
  #controls {
    position: fixed;
    top: auto; bottom: 0; right: 0; left: 0;
    width: 100%;
    border-radius: 12px 12px 0 0;
    padding: 10px 12px 28px;
    max-height: 60vh;
    overflow-y: auto;
    z-index: 1002;
    display: none;
  }
  #controls.mobile-open { display: block; }
  #controls h2 { font-size: 11px; }
  .ctrl-section { margin-bottom: 8px; }
  .mode-btn { padding: 8px 10px; font-size: 13px; }
  .toggle-btn { padding: 6px 10px; font-size: 12px; margin-bottom: 5px; }

  /* Hide legend and breakdown entirely - too much clutter */
  #legend { display: none; }
  #breakdown { display: none; }

  /* Info bar - compact title only, top left */
  #info-bar {
    top: 8px; left: 8px;
    width: auto; max-width: 180px;
    padding: 6px 10px;
  }
  #info-bar h1 { font-size: 11px; margin: 0; }
  #info-bar p { display: none; }

  /* FAB */
  #mobile-menu-btn { display: flex !important; }

  /* Popup */
  .leaflet-popup-content { width: 260px !important; font-size: 12px; }
  .px-tbl td { padding: 4px; }
  .info-icon .tip { left: auto; right: 0; width: 180px; font-size: 10px; }

  /* Zoom control clear of info-bar */
  .leaflet-control-zoom { margin-top: 60px !important; }
}

/* Hamburger button - hidden on desktop */
#mobile-menu-btn {
  display: none;
  position: fixed;
  bottom: 12px;
  right: 12px;
  z-index: 1003;
  background: #1a4a8a;
  border: 1px solid #3a7aca;
  border-radius: 50%;
  width: 48px;
  height: 48px;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 3px 12px rgba(0,0,0,0.5);
  font-size: 20px;
  color: white;
}
</style>
</head>
<body>
<button id="mobile-menu-btn" onclick="toggleMobileMenu()" title="Map Controls">⚙</button>
<div class="loading" id="loading">
  <div style="font-size:26px;margin-bottom:10px">🔥</div>
  <div>Initializing map data<span class="dot-anim"></span></div>
  <div style="font-size:11px;color:#5a8abf;margin-top:6px">12,610 parcels · 2025 RE + PP tax</div>
  <div style="font-size:10px;color:#3a5a7a;margin-top:4px">First load may take 10-15 seconds</div>
</div>
<div id="map"></div>
<div id="info-bar" class="panel">
  <h1>Clinton County Tax Heat Map 2025</h1>
  <p>Combined RE &amp; PP tax · click any parcel for detail</p>
</div>
<div id="breakdown" class="panel">
  <div id="breakdown-content"></div>
</div>
<div id="controls" class="panel">
  <h2>⚙ Map Controls</h2>
  <div class="ctrl-section">
    <label>Color by</label>
    <button class="mode-btn active" data-mode="category"   onclick="setMode(this)">🏷 Property Category</button>
    <button class="mode-btn"        data-mode="per_acre"   onclick="setMode(this)">📐 Tax per Acre</button>

  </div>

  <div class="ctrl-section">
    <label>Overlays</label>
    <button class="toggle-btn" id="btn-twp"    onclick="toggleOverlay('twp')">Townships</button>

    <button class="toggle-btn" id="btn-cities" onclick="toggleOverlay('cities')">Cities</button>
  </div>
</div>
<div id="legend" class="panel">
  <h3 id="leg-title">Property Category</h3>
  <div id="leg-body"></div>
</div>

<script>
let TAX={};  // loaded async below
const F={CAT:0,TC:1,TR:2,AC:3,RE:4,PP:5,TOT:6,PA:7,DEL:8,HPP:9};

const CAT_COLOR={MUN:'#dc2626',SR:'#2563eb',LT:'#16a34a',C:'#ea580c',AG:'#6b7280',OT:'#374151'};
const CAT_LABEL={MUN:'Municipal Residential',SR:'Small Tract Residential',LT:'Agricultural with Homestead',C:'Commercial',AG:'Agriculture without Homestead',OT:'Other'};
const CAT_TIP={
  HD:'Parcels with a residential structure on lots smaller than 5 acres. Typically in-town and suburban properties.',
  LT:'Parcels with a residential structure on 5 or more acres — rural homesteads, farmsteads with a dwelling.',
  C:'Any parcel carrying commercial assessed value — businesses, retail, industrial, rental properties.',
  AG:'Agricultural land with no residential structure. Raw cropland, pasture, or farm tracts where the house is on a separate parcel.',
  OT:'Parcel present in county GIS but no 2025 tax record found.'
};

const map=L.map('map',{preferCanvas:true});
map.setView([39.60,-94.37],11);
const streetTile=L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors © <a href="https://carto.com/">CARTO</a>',subdomains:'abcd'}).addTo(map);

L.control.scale({imperial:true,metric:false}).addTo(map);

let currentMode='category',parcelLayer=null;
const overlays={twp:null,cities:null};
const overlayOn={twp:false,cities:false};


function colorPerAcre(v){
  if(!v||v<1)return'#e8e8e8';
  if(v<100) return'#fff1f2'; if(v<500) return'#fca5a5';
  if(v<1500)return'#ef4444'; if(v<5000)return'#b91c1c';
  return'#7f1d1d';
}
function getStyle(feature){
  const pn=feature.properties._pn;
  const d=pn?TAX[pn]:null;
  let fill='#1a1a2e',op=0.1,stroke='#33405a',sw=0.35;
  if(d){
    if(currentMode==='category'){
      fill=CAT_COLOR[d[F.CAT]]||'#94a3b8';
      op=0.80;
    } else if(currentMode==='per_acre'){
      fill=colorPerAcre(d[F.PA]);
      op=(d[F.PA]<1)?0.4:0.82;
    }
  }
  return{color:stroke,weight:sw,opacity:0.6,fillColor:fill,fillOpacity:op};
}

function fmt$(v){return'$'+Number(v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}

function buildPopup(pn){
  const d=TAX[pn];
  if(!d) return '<div class="px"><div class="px-title">No 2025 tax record</div><small>'+pn+'</small></div>';
  let h='<div class="px"><div class="px-title">Parcel Detail — 2025</div>';
  if(d[F.T5]) h+='<span class="px-badge" style="background:#000000;color:#ffffff">★ #'+d[F.T5]+' Top Revenue Parcel</span><br>';
  h+='<span class="px-badge px-'+d[F.CAT]+'">'+CAT_LABEL[d[F.CAT]]+'</span>';
  if(d[F.DEL]) h+='<span class="px-badge px-delinq">⚠ Delinquent</span>';
  if(d[F.HPP]) h+='<span class="px-badge px-pp">+ PP Linked</span>';
  h+='<table class="px-tbl">';
  h+='<tr><td>Parcel #</td><td>'+pn+'</td></tr>';
  h+='<tr><td>Tax Code</td><td>'+d[F.TC]+'</td></tr>';
  h+='<tr><td>Tax Rate</td><td>$'+d[F.TR]+' per $100</td></tr>';
  h+='<tr><td>Acres</td><td>'+d[F.AC]+'</td></tr>';
  h+='<tr><td colspan=2 style="padding-top:5px;font-size:10px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.05em">2025 Tax</td></tr>';
  h+='<tr><td>RE Tax Due</td><td>'+fmt$(d[F.RE])+'</td></tr>';
  if(d[F.HPP]) h+='<tr><td>PP Tax (linked)</td><td>'+fmt$(d[F.PP])+'</td></tr>';
  h+='<tr class="px-hi"><td><b>Combined Total</b></td><td><b style="color:#b91c1c">'+fmt$(d[F.TOT])+'</b></td></tr>';
  if(d[F.AC]>=0.1) h+='<tr class="px-hi2"><td>Tax / Acre</td><td>'+fmt$(d[F.PA])+'/ac</td></tr>';
  h+='</table>';
  // Category explanation
  h+='<div style="margin-top:8px;padding-top:7px;border-top:1px solid #eee;font-size:10px;color:#777;line-height:1.4">';
  h+=CAT_TIP[d[F.CAT]]||'';
  h+='</div></div>';
  return h;
}

    <div style="margin-top:4px;font-size:10px;color:#666">Small residential lots brightest — high revenue per acre vs. large rural parcels</div>`}

  per_acre:`

function updateBreakdown(mode){
  const el = document.getElementById('breakdown-content');
  if(el) el.innerHTML = BREAKDOWNS[mode] || '';
}

function updateLegend(mode){
  document.getElementById('leg-title').textContent=LEGENDS[mode].title;
  document.getElementById('leg-body').innerHTML=LEGENDS[mode].html+`<div style="margin-top:9px;padding-top:7px;border-top:1px solid rgba(255,255,255,0.1);font-size:10px;color:#4a6a8a;line-height:1.5">      <b style="color:#5a8abf">PP coverage: 71.9%</b>      <span class="info-icon">ⓘ<span class="tip" style="left:auto;right:18px">71.9% of total PP tax ($4.67M of $6.49M) was matched to a RE parcel by name + tax code. Each PP account assigned to owner\\'s primary parcel only — no double counting. Remaining $1.83M belongs to renters and non-landowners.</span></span><br>      Clinton County\\'s full 2025 tax levy of ~$26.3M is completely accounted for — $24.4M mapped to parcels, $1.83M identified as PP tax from non-landowners who rent or hold no real estate in the county.    </div>`; 
}
function setMode(btn){
  currentMode=btn.dataset.mode;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  updateLegend(currentMode);
  updateBreakdown(currentMode);
  if(parcelLayer)parcelLayer.setStyle(getStyle);
}

function toggleOverlay(k){
  overlayOn[k]=!overlayOn[k];
  document.getElementById('btn-'+k).classList.toggle('active',overlayOn[k]);
  const l=overlays[k];
  if(l){overlayOn[k]?map.addLayer(l):map.removeLayer(l);}
}

function setLoading(msg){
  document.getElementById('loading').innerHTML='<div style="font-size:22px;margin-bottom:10px">🔥</div><div>'+msg+'</div><div style="font-size:11px;color:#5a8abf;margin-top:6px">12,610 parcels · 2025 RE + PP tax</div>';
}

async function safeFetch(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error(url+' returned HTTP '+r.status);
  return await r.json();
}

async function loadMap(){
  // Step 0: load tax lookup data
  setLoading('Loading tax data…');
  const taxData = await safeFetch('/api/tax?v=20260614d');
  Object.assign(TAX, taxData);
  const delinqCount = Object.values(TAX).filter(v=>v[8]===1).length;
  console.log('TAX loaded:', Object.keys(TAX).length, 'parcels,', delinqCount, 'delinquent');

  // Step 1: parcels
  setLoading('Loading parcels…');
  const pData = await safeFetch('/static/Parcels/parcels.geojson?v=20260614d');

  setLoading('Rendering '+pData.features.length.toLocaleString()+' parcels…');
  pData.features.forEach(f=>{
    f.properties._pn=f.properties.parcel_num||f.properties.parcel_number||'';
  });

  parcelLayer=L.geoJSON(pData,{
    renderer:L.canvas(),style:getStyle,smoothFactor:0,
    onEachFeature(feature,layer){
      layer.on('click',e=>{
        L.popup({maxWidth:310}).setLatLng(e.latlng).setContent(buildPopup(feature.properties._pn)).openOn(map);
        L.DomEvent.stopPropagation(e);
      });
    }
  }).addTo(map);

  // Show map immediately - don't wait for overlays
  document.getElementById('loading').style.display='none';
  updateLegend('category');
  updateBreakdown('category');
  // markers only show in combined mode - not on initial load
  setTimeout(function(){
    map.invalidateSize();
    try{ map.fitBounds(parcelLayer.getBounds(),{padding:[30,30]}); }catch(e){}
  },150);

  // Step 2: overlays in background - failures won't break the map
  try {
    const tData = await safeFetch('/static/Townships/townships.geojson');
    overlays.twp=L.geoJSON(tData,{renderer:L.canvas(),
      style:{color:'#ffffff',weight:3,opacity:0.9,fillOpacity:0},
      onEachFeature(f,layer){
        const name=f.properties?.NAME||f.properties?.NAMELSAD||'';
        if(name)layer.bindTooltip(name,{permanent:true,direction:'center',className:'township-label'});
      }
    });
  } catch(e){ console.warn('Townships failed:',e.message); }



  try {
    const cData = await safeFetch('/static/Cities/cities.geojson');
    overlays.cities=L.geoJSON(cData,{
    renderer:L.canvas(),
    style:{color:'#000000',weight:1.5,opacity:0.5,fillOpacity:0},
    onEachFeature(f,layer){
      if(f.properties?.NAME)layer.bindTooltip(f.properties.NAME,{permanent:true,className:'city-label'});
    }
  });
  } catch(e){ console.warn('Cities failed:',e.message); }
}

// Defer loadMap so loading screen renders before heavy JS executes
loadMap().catch(err=>{
  document.getElementById('loading').innerHTML='<div style="font-size:26px;margin-bottom:8px">⚠️</div><b style="color:#ef4444">Map failed to load</b><br><span style="font-size:11px;color:#aaa;display:block;margin:6px 0">'+err.message+'</span><button onclick="location.reload()" style="margin-top:8px;padding:8px 18px;background:#1a4a8a;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px">Retry</button>';
  console.error('loadMap error:',err);
});
// Mobile menu toggle
function toggleMobileMenu(){
  const c=document.getElementById('controls');
  const btn=document.getElementById('mobile-menu-btn');
  c.classList.toggle('mobile-open');
  btn.textContent=c.classList.contains('mobile-open')?'✕':'⚙';
}

// Close controls when a mode is selected on mobile
document.querySelectorAll('.mode-btn,.toggle-btn').forEach(btn=>{
  btn.addEventListener('click',function(){
    if(window.innerWidth<=768){
      setTimeout(()=>{
        document.getElementById('controls').classList.remove('mobile-open');
        document.getElementById('mobile-menu-btn').textContent='⚙';
      },300);
    }
  });
});

// On mobile, make ⓘ tips work on tap
if('ontouchstart' in window){
  document.querySelectorAll('.info-icon').forEach(el=>{
    el.addEventListener('click',function(e){
      e.stopPropagation();
      const tip=this.querySelector('.tip');
      const isOpen=tip.style.display==='block';
      document.querySelectorAll('.info-icon .tip').forEach(t=>t.style.display='none');
      tip.style.display=isOpen?'none':'block';
    });
  });
  document.addEventListener('click',function(){
    document.querySelectorAll('.info-icon .tip').forEach(t=>t.style.display='none');
  });
}
</script>
</body>
