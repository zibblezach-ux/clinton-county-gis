<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Clinton County — Road &amp; Bridge GIS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: Arial, sans-serif; }
    #map { width: 100%; height: 100vh; }
    .leaflet-control-layers { font-size: 13px; max-height: 350px; overflow-y: auto; }

    .back-btn {
      position: absolute; top: 10px; left: 10px; z-index: 1001;
      background: rgba(17,24,39,0.92); color: #e8e4d9; border: none;
      border-radius: 6px; padding: 8px 14px; font-size: 13px; cursor: pointer;
      text-decoration: none; display: inline-block;
    }
    .back-btn:hover { background: rgba(30,40,60,0.98); }

    .info-panel {
      position: absolute; top: 50px; left: 10px; z-index: 1000;
      background: rgba(17,24,39,0.92); color: #e8e4d9;
      padding: 10px 14px; border-radius: 6px; font-size: 13px; max-width: 280px;
    }
    .info-title { font-weight: bold; font-size: 15px; margin-bottom: 4px; }
    #status { font-size: 11px; color: #6b7a99; margin-top: 6px; }

    .leaflet-popup-content-wrapper {
      background: rgba(17,24,39,0.95); color: #e8e4d9;
      border-radius: 6px; border: 1px solid #2d3650;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    .leaflet-popup-tip { background: rgba(17,24,39,0.95); }
    .leaflet-popup-content { margin: 10px 14px; font-size: 13px; line-height: 1.6; }
    .popup-title { font-weight: bold; font-size: 14px; color: #ffffff; margin-bottom: 6px; border-bottom: 1px solid #2d3650; padding-bottom: 4px; }
    .popup-row { display: flex; justify-content: space-between; gap: 12px; }
    .popup-label { color: #6b7a99; }
    .popup-value { color: #e8e4d9; text-align: right; }
    .leaflet-popup-close-button { color: #6b7a99 !important; }

    /* ── Mobile ── */
    @media (max-width: 700px) {
      .info-panel { display: none; }
      .leaflet-control-layers { display: none !important; }
      .back-btn { top: 10px; left: 10px; padding: 8px 12px; font-size: 13px; }

      #mobile-panel {
        display: block;
        position: fixed; bottom: 0; left: 0; right: 0; z-index: 3000;
        background: rgba(17,24,39,0.97); color: #e8e4d9;
        border-radius: 14px 14px 0 0;
        padding: 14px 16px 24px;
        transform: translateY(110%);
        transition: transform 0.22s ease;
        max-height: 70vh; overflow-y: auto;
      }
      #mobile-panel.open { transform: translateY(0); }
      #mobile-panel h3 { margin: 0 0 12px; font-size: 15px; color: #fff; }
      .mob-close {
        float: right; background: #2d3650; color: #e8e4d9;
        border: none; border-radius: 6px; padding: 5px 10px;
        font-size: 13px; font-weight: bold; cursor: pointer;
      }
      .mob-status { font-size: 11px; color: #6b7a99; margin-bottom: 12px; }
      .mob-layer { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #2d3650; font-size: 14px; }
      .mob-layer:last-child { border-bottom: none; }
      .mob-layer input[type=checkbox] { width: 18px; height: 18px; cursor: pointer; }
      .mob-swatch { width: 22px; height: 5px; border-radius: 3px; flex-shrink: 0; }

      #mob-fab {
        display: flex;
        position: fixed; bottom: 20px; right: 16px; z-index: 2000;
        width: 50px; height: 50px; border-radius: 50%;
        background: rgba(17,24,39,0.95); color: #e8e4d9;
        border: 1px solid #2d3650; font-size: 22px;
        align-items: center; justify-content: center;
        cursor: pointer; box-shadow: 0 3px 12px rgba(0,0,0,0.5);
      }
      .leaflet-control-zoom { margin-top: 60px !important; }
    }

    @media (min-width: 701px) {
      #mobile-panel { display: none; }
      #mob-fab { display: none; }
    }
  </style>
</head>
<body>

<a class="back-btn" href="/">← Back</a>

<!-- Desktop info panel -->
<div class="info-panel">
  <div class="info-title">Road &amp; Bridge GIS</div>
  Use the layer control (top right) to toggle layers
  <div id="status">Loading...</div>
</div>

<div id="map"></div>

<!-- Mobile FAB -->
<button id="mob-fab" onclick="toggleMobPanel()" title="Layers">☰</button>

<!-- Mobile bottom sheet -->
<div id="mobile-panel">
  <button class="mob-close" onclick="toggleMobPanel()">Close</button>
  <h3>Road &amp; Bridge GIS</h3>
  <div class="mob-status" id="mob-status">Loading...</div>
  <div class="mob-layer">
    <input type="checkbox" id="m-modot" checked>
    <div class="mob-swatch" style="background:#4a90d9"></div>
    <label for="m-modot">MoDOT (state highways)</label>
  </div>
  <div class="mob-layer">
    <input type="checkbox" id="m-county" checked>
    <div class="mob-swatch" style="background:#5ab87a"></div>
    <label for="m-county">Clinton County Commission</label>
  </div>
  <div class="mob-layer">
    <input type="checkbox" id="m-municipal" checked>
    <div class="mob-swatch" style="background:#cc44cc"></div>
    <label for="m-municipal">Municipal (city streets)</label>
  </div>
  <div class="mob-layer">
    <input type="checkbox" id="m-muni-bound" checked>
    <div class="mob-swatch" style="background:#a86cc1;height:2px;border-style:dashed"></div>
    <label for="m-muni-bound">City limits (boundary)</label>
  </div>
</div>

<script>
const countyBounds = L.latLngBounds(L.latLng(39.35, -94.75), L.latLng(39.85, -94.05));
const map = L.map('map', { maxBounds: countyBounds, maxBoundsViscosity: 0.9 }).setView([39.58, -94.40], 11);

const esri = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
  { maxZoom: 19, attribution: 'Tiles &copy; Esri &mdash; Esri, HERE, Garmin, USGS' }
).addTo(map);
const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' });
const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Tiles &copy; Esri' });

L.control.scale().addTo(map);

const clintonBoundaryLayer = L.layerGroup().addTo(map);
const modotLayer     = L.layerGroup().addTo(map);
const countyLayer    = L.layerGroup().addTo(map);
const municipalLayer = L.layerGroup().addTo(map);
const muniBoundLayer = L.layerGroup().addTo(map);

function label(color, text) {
  return '<span style="display:inline-block;width:20px;height:4px;border-radius:2px;background:' + color + ';margin-right:6px;vertical-align:middle"></span>' + text;
}
const overlays = {
  [label('#4a90d9', 'MoDOT (state highways)')]:   modotLayer,
  [label('#5ab87a', 'Clinton County Commission')]: countyLayer,
  [label('#cc44cc', 'Municipal (city streets)')]:  municipalLayer,
  [label('#a86cc1', 'City limits (boundary)')]:    muniBoundLayer
};
L.control.layers(
  { 'ESRI Street': esri, 'OpenStreetMap': osm, 'ESRI Satellite': satellite },
  overlays, { collapsed: false }
).addTo(map);

var loaded = 0, total = 5;

function setStatus(msg) {
  document.getElementById('status').textContent = msg;
  document.getElementById('mob-status').textContent = msg;
}

function popupContent(props, jurisdiction) {
  var tigerName = props.FULLNAME || '';
  var osmName   = props.OSM_NAME || '';
  var displayName = osmName || tigerName || 'Unnamed Road';
  var mtfccLabels = { 'S1100':'Primary Road','S1200':'Secondary Road','S1400':'Local Road','S1500':'Vehicular Trail','S1630':'Ramp','S1640':'Service Drive','S1730':'Alley','S1740':'Private Road','S1780':'Parking Lot' };
  var html = '<div class="popup-title">' + displayName + '</div>';
  html += '<div class="popup-row"><span class="popup-label">Maintained by</span><span class="popup-value">' + jurisdiction + '</span></div>';
  if (props.MTFCC) html += '<div class="popup-row"><span class="popup-label">Road class</span><span class="popup-value">' + (mtfccLabels[props.MTFCC] || props.MTFCC) + '</span></div>';
  return html;
}

async function loadLayer(url, target, style, jurisdiction) {
  try {
    const response = await fetch(url);
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const data = await response.json();
    if (data.features && data.features.length > 0) {
      L.geoJSON(data, {
        style: style,
        onEachFeature: function(feature, layer) {
          layer.bindPopup(popupContent(feature.properties || {}, jurisdiction), { maxWidth: 260 });
          layer.on('mouseover', function() { layer.setStyle({ weight: style.weight + 2, opacity: 1 }); });
          layer.on('mouseout',  function() { layer.setStyle(style); });
        }
      }).addTo(target);
    }
    loaded++;
    setStatus(loaded < total ? 'Loading (' + loaded + '/' + total + ')...' : 'All layers loaded — tap any road for details');
  } catch(err) { console.error(jurisdiction + ' failed:', err); loaded++; }
}

async function loadBoundary(url, style, target) {
  try {
    const response = await fetch(url);
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const data = await response.json();
    if (data.features && data.features.length > 0) {
      L.geoJSON(data, { style: style }).addTo(target);
    }
    loaded++;
    setStatus(loaded < total ? 'Loading (' + loaded + '/' + total + ')...' : 'All layers loaded — tap any road for details');
  } catch(err) { console.error('Boundary failed:', err); loaded++; }
}

async function loadMap() {
  await loadBoundary('/api/roads/clinton', { color: '#ffffff', weight: 2.5, dashArray: '6,4', fillOpacity: 0.0 }, clintonBoundaryLayer);
  await loadBoundary('/api/roads/muni_boundaries', { color: '#a86cc1', weight: 1.5, dashArray: '5,4', fillOpacity: 0.05, fillColor: '#a86cc1' }, muniBoundLayer);
  await loadLayer('/api/roads/modot',     modotLayer,     { color: '#4a90d9', weight: 4,   opacity: 1 }, 'MoDOT');
  await loadLayer('/api/roads/county',    countyLayer,    { color: '#5ab87a', weight: 2.5, opacity: 1 }, 'Clinton County Commission');
  await loadLayer('/api/roads/municipal', municipalLayer, { color: '#cc44cc', weight: 2.5, opacity: 1 }, 'Municipal');
}

loadMap();

// Mobile panel toggle
function toggleMobPanel() {
  const panel = document.getElementById('mobile-panel');
  panel.classList.toggle('open');
  setTimeout(() => map.invalidateSize(), 250);
}

// Mobile layer checkboxes wire up to the same layer groups
document.getElementById('m-modot').addEventListener('change', function(e) {
  e.target.checked ? modotLayer.addTo(map) : map.removeLayer(modotLayer);
});
document.getElementById('m-county').addEventListener('change', function(e) {
  e.target.checked ? countyLayer.addTo(map) : map.removeLayer(countyLayer);
});
document.getElementById('m-municipal').addEventListener('change', function(e) {
  e.target.checked ? municipalLayer.addTo(map) : map.removeLayer(municipalLayer);
});
document.getElementById('m-muni-bound').addEventListener('change', function(e) {
  e.target.checked ? muniBoundLayer.addTo(map) : map.removeLayer(muniBoundLayer);
});

window.addEventListener('resize', () => map.invalidateSize());
</script>
</body>
</html>
